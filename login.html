<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập – XYZ Meeting Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#F5F6FA;display:flex;align-items:center;justify-content:center;min-height:100vh;}
.login-card{background:#fff;border-radius:12px;border:1px solid #E8EAF0;padding:40px 36px;width:100%;max-width:400px;}
.logo-box{width:48px;height:48px;border-radius:12px;background:#534AB7;display:flex;
          align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:700;margin:0 auto 12px;}
.btn-login{background:#534AB7;border-color:#534AB7;}
.btn-login:hover{background:#3C3489;border-color:#3C3489;}
</style>
</head>
<body>
<div class="login-card">
  <div class="text-center mb-4">
    <div class="logo-box">A</div>
    <h5 class="fw-bold" style="color:#1E2A45">XYZ Meeting – Admin</h5>
    <small class="text-muted">Hệ thống quản lý lịch họp nội bộ</small>
  </div>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in msgs %}
      <div class="alert alert-{{ cat }} py-2">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  <form method="POST">
    <div class="mb-3">
      <label class="form-label fw-semibold">Email</label>
      <input type="email" name="email" class="form-control" placeholder="admin@company.vn" required>
    </div>
    <div class="mb-4">
      <label class="form-label fw-semibold">Mật khẩu</label>
      <input type="password" name="password" class="form-control" placeholder="••••••••" required>
    </div>
    <button class="btn btn-primary btn-login w-100 fw-semibold">Đăng nhập</button>
  </form>
  <hr class="my-3">
  <small class="text-muted d-block text-center">
    
  </small>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
